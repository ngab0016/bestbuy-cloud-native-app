    - port: 3030
      targetPort: 3030

---
# Store Front (Frontend) Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-front
  template:
    metadata:
      labels:
        app: store-front
    spec:
      containers:
        - name: store-front
          image: darkxnight/store-front-l8:latest
          ports:
            - containerPort: 80
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3000"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3030"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
# Store Front Service
apiVersion: v1
kind: Service
metadata:
  name: store-front
spec:
  selector:
    app: store-front
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

